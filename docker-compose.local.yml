version: '3.8'

services:
  order-service:
    build:
      context: ./src
      dockerfile: Services/Order/Order.API/Dockerfile
    ports:
      - "5003:5003"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/orders.db
    volumes:
      - order_data:/app/data

  quickapp-monolith:
    build:
      context: ../quickapp-monolith
      dockerfile: Dockerfile
    ports:
      - "5225:5225"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5225
      - OrderService__BaseUrl=http://order-service:5003
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/quickapp.db
    volumes:
      - monolith_data:/app/data
    depends_on:
      - order-service

volumes:
  order_data:
  monolith_data:
