worker_processes auto;

events {
    worker_connections 1024;
}

http {
    sendfile        on;
    keepalive_timeout 65;

    # ── Upstream: YARP API Gateway ───────────────────────────
    upstream api_gateway {
        server api-gateway:5000;
    }

    server {
        listen 80;
        server_name _;

        # ── Nginx health endpoint ────────────────────────────
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ── Proxy all API traffic to the YARP gateway ────────
        location / {
            proxy_pass         http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_read_timeout 90s;
            proxy_connect_timeout 10s;
        }

        # ── Swagger UI per service (development convenience) ─
        location /swagger/identity/ {
            proxy_pass http://api_gateway/api/identity/swagger/;
            proxy_set_header Host $host;
        }

        location /swagger/customers/ {
            proxy_pass http://api_gateway/api/customers/swagger/;
            proxy_set_header Host $host;
        }

        location /swagger/orders/ {
            proxy_pass http://api_gateway/api/orders/swagger/;
            proxy_set_header Host $host;
        }

        location /swagger/products/ {
            proxy_pass http://api_gateway/api/products/swagger/;
            proxy_set_header Host $host;
        }

        location /swagger/notifications/ {
            proxy_pass http://api_gateway/api/notifications/swagger/;
            proxy_set_header Host $host;
        }
    }
}
